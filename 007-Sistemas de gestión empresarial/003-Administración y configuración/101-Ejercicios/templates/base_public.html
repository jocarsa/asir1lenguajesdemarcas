<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Sistema de Tickets" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
  <div class="container topbar-inner">
    <div class="brand">
      <span class="brand-jocarsa">jocarsa</span>
      <span class="brand-sep">|</span>
      <span class="brand-product">ticketing</span>
    </div>

    <nav class="nav">
      <a href="{{ url_for('public_new_ticket') }}">Crear ticket</a>
      <a href="{{ url_for('admin_login') }}">Administración</a>
    </nav>
  </div>
</header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for category, msg in messages %}
            <div class="msg {{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <small>© {{ now.year }} Ticketing</small>
    </div>
  </footer>
</body>
</html>
